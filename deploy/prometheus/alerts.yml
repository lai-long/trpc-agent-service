# Alert rules for trpc-agent-service (design 5.2.4). Loaded via rule_files in
# prometheus.yml; route them to your receiver of choice in Alertmanager.
groups:
  - name: trpc-agent-service
    rules:
      # Queue backlog: >50k entries means consumers are hopelessly behind and
      # the MAXLEN truncation boundary is near (the no-loss guarantee ends
      # there — see design 5.1.4).
      - alert: StreamBacklogHigh
        expr: stream_length{stream=~"stream:inbound|stream:outbound"} > 50000
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "stream {{ $labels.stream }} backlog {{ $value }} entries"

      # A pending entry idle for >5min means its consumer crashed or is stuck;
      # the reaper should have claimed it long ago.
      - alert: StreamPendingStuck
        expr: stream_oldest_pending_seconds > 300
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "oldest pending in {{ $labels.stream }}/{{ $labels.group }} is {{ $value }}s old"

      # Anything in the dead-letter stream needs human intervention.
      - alert: DeadLetterPresent
        expr: stream_length{stream="stream:deadletter"} > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} dead-lettered messages await intervention"

      # Worker processing p95 beyond the 15s end-to-end budget (design §1).
      - alert: WorkerProcessSlow
        expr: histogram_quantile(0.95, rate(worker_process_duration_bucket[5m])) > 15000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "worker process p95 {{ $value }}ms exceeds the 15s budget"

      # Processing error rate above 1% (design 5.2.4).
      - alert: ProcessErrorRateHigh
        expr: |
          sum(rate(worker_process_error_total[5m]))
            / clamp_min(sum(rate(im_inbound_total[5m])), 1) > 0.01
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "process error rate {{ $value }} > 1%"

      # IM delivery success rate below 99% (design 5.2.4).
      - alert: IMDeliveryDegraded
        expr: |
          sum(rate(im_outbound_total{result="ok"}[5m]))
            / clamp_min(sum(rate(im_outbound_total[5m])), 1) < 0.99
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "IM delivery success {{ $value }} < 99%"

      # Send pacing is re-queuing messages: an IM platform limit is biting.
      - alert: SendRateLimited
        expr: rate(send_rate_limited_total[10m]) > 0
        for: 10m
        labels: {severity: info}
        annotations:
          summary: "outbound sends re-queued by pacing on {{ $labels.channel }}"

      # Gateway admission control rejects traffic (rate limit or backpressure).
      - alert: GatewayRejecting
        expr: rate(gateway_rejected_total[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "gateway rejecting callbacks: reason={{ $labels.reason }}"
