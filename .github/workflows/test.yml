# CI gate (review P0-4): the integration tests run against real services and
# a run with skips > 0 or coverage below baseline fails. Skips are visible
# failures here, not green shrugs — the platforms' core paths (PG session/
# memory, stream redelivery, locks, migration, S3, admin) must execute.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16 # same image as docker-compose (vector ext)
        env:
          POSTGRES_USER: trpc
          POSTGRES_PASSWORD: trpc-dev-only
          POSTGRES_DB: trpc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trpc -d trpc"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: trpc
          MINIO_ROOT_PASSWORD: trpc-dev-only
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRPC_TEST_PG_DSN: postgres://trpc:trpc-dev-only@localhost:5432/trpc?sslmode=disable
      TRPC_TEST_REDIS_ADDR: localhost:6379
      TRPC_TEST_S3_ENDPOINT: localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Init DB schema
        run: |
          psql "$TRPC_TEST_PG_DSN" -v ON_ERROR_STOP=1 -f deploy/db/init.sql
          psql "$TRPC_TEST_PG_DSN" -v ON_ERROR_STOP=1 -f deploy/db/seed.sql

      - name: Test (integration deps live)
        run: |
          go test ./... -count=1 -v -coverprofile=coverage.out 2>&1 | tee test.log
          grep -E "^(FAIL|ok)" test.log | grep -q FAIL && {
            echo "::error::test failure"; exit 1; }

      - name: "Gate: zero skips"
        run: |
          skips=$(grep -c '^--- SKIP' test.log || true)
          if [ "$skips" != "0" ]; then
            grep '^--- SKIP' test.log
            echo "::error::$skips integration test(s) skipped - the gate is zero"
            exit 1
          fi

      - name: "Gate: coverage baseline"
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t >= 40) }' || {
            echo "::error::coverage ${total}% below baseline 40%"; exit 1; }

      - name: Coverage report
        run: go tool cover -func=coverage.out | tail -1
