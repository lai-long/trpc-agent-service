# CI gate (review P0-4): the integration tests run against real services and
# a run with skips > 0 or coverage below baseline fails. Skips are visible
# failures here, not green shrugs — the platforms' core paths (PG session/
# memory, stream redelivery, locks, migration, S3, admin) must execute.
#
# Gate inventory: gofmt, go vet, golangci-lint, go mod tidy cleanliness,
# the full suite under -race, zero skips, total coverage floor, and (on PRs)
# diff coverage of the changed lines.
#
# The vendored wxbizmsgcrypt module (Tencent's official callback crypto
# library) is deliberately out of scope for vet/lint: patching it would
# diverge from upstream.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16 # same image as docker-compose (vector ext)
        env:
          POSTGRES_USER: trpc
          POSTGRES_PASSWORD: trpc-dev-only
          POSTGRES_DB: trpc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trpc -d trpc"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: trpc
          MINIO_ROOT_PASSWORD: trpc-dev-only
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRPC_TEST_PG_DSN: postgres://trpc:trpc-dev-only@localhost:5432/trpc?sslmode=disable
      TRPC_TEST_REDIS_ADDR: localhost:6379
      TRPC_TEST_S3_ENDPOINT: localhost:9000
    steps:
      - uses: actions/checkout@v4
        with:
          # the diff-coverage gate diffs against origin/<base_ref>
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: "Gate: gofmt"
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          # goinstall compiles golangci-lint with the workflow's own Go
          # toolchain: the prebuilt binaries lag the repo's go directive and
          # then refuse to typecheck it (export data version mismatch).
          install-mode: goinstall

      - name: "Gate: go mod tidy"
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy - run 'go mod tidy'"
            exit 1
          fi

      - name: Init DB schema
        run: |
          psql "$TRPC_TEST_PG_DSN" -v ON_ERROR_STOP=1 -f deploy/db/init.sql
          psql "$TRPC_TEST_PG_DSN" -v ON_ERROR_STOP=1 -f deploy/db/seed.sql

      - name: Test (integration deps live, race detector on)
        run: |
          set -o pipefail
          go test ./... -count=1 -race -v -coverprofile=coverage.out 2>&1 | tee test.log
          if grep -qE '^FAIL' test.log; then
            echo "::error::test failure"
            exit 1
          fi

      - name: "Gate: zero skips"
        run: |
          skips=$(grep -c '^--- SKIP' test.log || true)
          if [ "$skips" != "0" ]; then
            grep '^--- SKIP' test.log
            echo "::error::$skips integration test(s) skipped - the gate is zero"
            exit 1
          fi

      - name: "Gate: coverage baseline"
        # 只升不降 (ratchet): the floor is the target, not the current state —
        # never lower it. Current coverage is ~62%; this gate stays red until
        # the suite reaches 85%.
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          if ! awk -v t="$total" 'BEGIN { exit !(t >= 85) }'; then
            echo "::error::coverage ${total}% below baseline 85%"
            exit 1
          fi

      - name: "Gate: diff coverage >= 85% (PR only)"
        # push-to-main has no base ref to diff against, so the gate is PR-only.
        if: github.event_name == 'pull_request'
        run: |
          go install github.com/boumenot/gocover-cobertura@v1.4.0
          "$(go env GOPATH)/bin/gocover-cobertura" < coverage.out > coverage.xml
          python3 -m pip install --user 'diff-cover==9.7.2'
          diff-cover coverage.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=85

      - name: Coverage report
        run: go tool cover -func=coverage.out | tail -1
